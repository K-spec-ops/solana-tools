[package]
name= "solana-tools"
version= "0.1.0"
edition= "2024"
description= "A collection of Rust scripts to automate common operations and processes on the Solana blockchain."
default-run= "sniper-trader"

[[bin]]
name= "sniper-trader"
path= "src/bin/sniperlauncher.rs"

[[bin]]
name= "execute-trades"
path= "src/subprocesses/executetrades.rs"

# Reduce memory usage
[profile.dev]
codegen-units= 1
opt-level= 0
debug= 0

[dependencies]
aws-config = "1.12.0"
aws-sdk-ec2 = "1.261.0"
aws-sdk-iam = "1.125.0"
aws-sdk-s3 = "1.148.0"
aws-sdk-sts = "1.116.0"
base64 = "0.23.1"
borsh = "1.8.1"
bs58 = "0.5.1"
clap= { version = "4.6.6", features = ["derive"] }
colored = "3.1.1"
csv = "1.4.0"
http = "1.5.0"
jiff = "0.2.37"
num_cpus = "1.17.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["json"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
simplelog = { version = "0.12.2", features = ["paris"] }
solana-client = "4.3.0"
solana-commitment-config = "3.1.1"
solana-sdk = "4.0.0"
solana-transaction-status-client-types = "4.3.0"
spl-associated-token-account-interface = "2.0.0"
spl-token-interface = "3.0.0"
terminal_hyperlink = "0.1.0"
time = { version = "0.3.55", features = ["formatting", "macros", "local-offset"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["local-time", "time", "std", "ansi"] }
uuid = { version = "1.26.1", features = ["v4"] }
